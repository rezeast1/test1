<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopGlass - База знаний</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TopGlass</h1>
            <p class="subtitle">База знаний</p>
            <button id="adminLoginBtn" class="admin-login-btn">Вход для админа</button>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по статьям..." autocomplete="off">
            <button id="searchBtn">Искать</button>
        </div>

        <div id="results" class="results-container"></div>

        <div id="articleView" class="article-view hidden">
            <button id="backBtn" class="back-btn">← Назад к результатам</button>
            <article id="articleContent"></article>
        </div>

        <div id="allArticles" class="all-articles">
            <div class="articles-header">
                <h2>Все статьи</h2>
                <div class="header-buttons">
                    <button id="addArticleBtn" class="add-article-btn hidden">Добавить тему</button>
                    <button id="suggestBtn" class="suggest-btn">Предложить тему</button>
                    <button id="resetViewsBtn" class="reset-btn">Сбросить просмотры</button>
                </div>
            </div>
            <div id="articlesList"></div>
        </div>

        <!-- Модальное окно для предложения темы -->
        <div id="suggestModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>Предложить новую тему</h2>
                <form id="suggestForm">
                    <div class="form-group">
                        <label for="suggestTitle">Название темы *</label>
                        <input type="text" id="suggestTitle" placeholder="Например: TypeScript" required>
                    </div>
                    <div class="form-group">
                        <label for="suggestKeywords">Ключевые слова (через запятую)</label>
                        <input type="text" id="suggestKeywords" placeholder="программирование, типизация, JavaScript">
                    </div>
                    <div class="form-group">
                        <label for="suggestContent">Описание темы *</label>
                        <textarea id="suggestContent" rows="8" placeholder="Опишите тему, которую хотите добавить..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="suggestEmail">Ваш email (необязательно)</label>
                        <input type="email" id="suggestEmail" placeholder="your@email.com">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Отправить предложение</button>
                        <button type="button" class="cancel-btn" id="cancelSuggest">Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Модальное окно для входа админа -->
        <div id="adminLoginModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal" id="closeAdminLogin">&times;</span>
                <h2>Вход для администратора</h2>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminUsername">Логин</label>
                        <input type="text" id="adminUsername" placeholder="admin" required>
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Пароль</label>
                        <input type="password" id="adminPassword" placeholder="••••••••" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Войти</button>
                        <button type="button" class="cancel-btn" id="cancelAdminLogin">Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Модальное окно для добавления темы (только для админа) -->
        <div id="addArticleModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal" id="closeAddArticle">&times;</span>
                <h2>Добавить новую тему</h2>
                <form id="addArticleForm">
                    <div class="form-group">
                        <label for="articleTitle">Название темы *</label>
                        <input type="text" id="articleTitle" placeholder="Например: TypeScript" required>
                    </div>
                    <div class="form-group">
                        <label for="articleKeywords">Ключевые слова (через запятую) *</label>
                        <input type="text" id="articleKeywords" placeholder="программирование, типизация, JavaScript" required>
                    </div>
                    <div class="form-group">
                        <label for="articleContentInput">Содержание темы *</label>
                        <textarea id="articleContentInput" rows="12" placeholder="Подробное описание темы..." required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Добавить тему</button>
                        <button type="button" class="cancel-btn" id="cancelAddArticle">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="firebase-config.js"></script>
    <script src="telegram-bot.js"></script>
    <script src="script.js"></script>
</body>
</html>
